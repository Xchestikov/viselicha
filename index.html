<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>English Hangman — Game Show</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg: #090b22;
      --panel: rgba(20, 24, 61, 0.9);
      --text: #f8f9ff;
      --muted: #aeb5df;
      --purple: #8b5cf6;
      --blue: #22d3ee;
      --pink: #ec4899;
      --green: #22c55e;
      --red: #ef4444;
      --yellow: #facc15;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at 15% 20%, rgba(139, 92, 246, .25), transparent 28%),
        radial-gradient(circle at 90% 10%, rgba(34, 211, 238, .2), transparent 25%),
        radial-gradient(circle at 80% 90%, rgba(236, 72, 153, .18), transparent 25%),
        linear-gradient(135deg, #08091d, #12163c 55%, #08091d);
      overflow-x: hidden;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      width: 220px;
      height: 220px;
      border-radius: 50%;
      filter: blur(70px);
      opacity: .25;
      pointer-events: none;
      z-index: -1;
    }

    body::before {
      top: 25%;
      left: -100px;
      background: var(--purple);
    }

    body::after {
      right: -100px;
      bottom: 15%;
      background: var(--blue);
    }

    .app {
      width: min(1240px, calc(100% - 32px));
      margin: 0 auto;
      padding: 26px 0 45px;
    }

    header {
      margin-bottom: 22px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-icon {
      width: 58px;
      height: 58px;
      display: grid;
      place-items: center;
      border-radius: 18px;
      font-size: 28px;
      background: linear-gradient(135deg, var(--purple), var(--pink));
      box-shadow: 0 0 28px rgba(139, 92, 246, .65);
    }

    h1 {
      margin: 0;
      font-size: clamp(25px, 4vw, 38px);
      letter-spacing: .5px;
    }

    .subtitle {
      margin-top: 6px;
      color: var(--muted);
      font-size: 14px;
    }

    .top-info {
      display: grid;
      grid-template-columns: 1fr auto auto;
      align-items: center;
      gap: 20px;
      margin-bottom: 20px;
    }

    .game-title {
      color: var(--blue);
      font-size: 17px;
      font-weight: 900;
      letter-spacing: 1px;
    }

    .score {
      color: var(--yellow);
      font-size: 18px;
      font-weight: 900;
      white-space: nowrap;
    }

    .question-counter {
      min-width: 150px;
      text-align: right;
      color: var(--muted);
      font-weight: 800;
      white-space: nowrap;
    }

    .progress {
      height: 7px;
      margin-bottom: 20px;
      border-radius: 20px;
      overflow: hidden;
      background: rgba(255,255,255,.1);
    }

    .progress-bar {
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--blue), var(--purple), var(--pink));
      box-shadow: 0 0 15px var(--blue);
      transition: width .4s ease;
    }

    .game {
      display: grid;
      grid-template-columns: 390px 1fr;
      gap: 20px;
    }

    .card {
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 24px;
      background: var(--panel);
      box-shadow:
        0 20px 55px rgba(0,0,0,.3),
        inset 0 1px rgba(255,255,255,.06);
      backdrop-filter: blur(14px);
    }

    .hangman {
      min-height: 520px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 22px;
    }

    .hangman-label {
      margin-bottom: 10px;
      color: var(--blue);
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 2px;
    }

    svg {
      width: min(100%, 330px);
      height: 390px;
      filter: drop-shadow(0 0 10px rgba(34,211,238,.2));
    }

    .draw {
      fill: none;
      stroke: #dce6ff;
      stroke-width: 8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .draw.hidden {
      visibility: hidden;
    }

    .hearts {
      display: flex;
      gap: 7px;
      min-height: 28px;
      font-size: 24px;
      filter: drop-shadow(0 0 7px rgba(239,68,68,.6));
    }

    .heart.lost {
      filter: grayscale(1);
      opacity: .2;
      transform: scale(.8);
    }

    .question-card {
      min-height: 520px;
      padding: 27px;
      position: relative;
      overflow: hidden;
    }

    .question-card::before {
      content: "";
      position: absolute;
      width: 240px;
      height: 240px;
      right: -120px;
      top: -120px;
      border-radius: 50%;
      background: rgba(34,211,238,.12);
    }

    .question-label {
      position: relative;
      color: var(--blue);
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 2px;
    }

    .question {
      position: relative;
      margin: 13px 0 28px;
      font-size: clamp(23px, 3vw, 32px);
      line-height: 1.25;
      font-weight: 900;
    }

    .word {
      min-height: 75px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: flex-end;
      gap: 11px;
      margin: 20px 0 30px;
    }

    .letter-slot {
      width: 42px;
      height: 55px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-bottom: 4px solid var(--blue);
      color: white;
      font-size: 32px;
      font-weight: 900;
      text-transform: uppercase;
      text-shadow: 0 0 14px var(--blue);
    }

    .status {
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: var(--muted);
      font-weight: 900;
      font-size: 18px;
    }

    .status.win {
      color: #86efac;
      animation: pop .45s ease;
    }

    .status.lose {
      color: #fca5a5;
      animation: shake .4s ease;
    }

    .keyboard {
      display: grid;
      grid-template-columns: repeat(9, 1fr);
      gap: 8px;
      margin-top: 14px;
    }

    .key {
      min-height: 45px;
      padding: 8px 4px;
      color: #dbeafe;
      background: rgba(94, 76, 190, .3);
      border: 1px solid rgba(139, 92, 246, .45);
      box-shadow: inset 0 1px rgba(255,255,255,.08);
      border-radius: 13px;
      font-weight: 800;
      cursor: pointer;
      transition: transform .2s, background .2s, box-shadow .2s;
    }

    .key:hover:not(:disabled) {
      transform: translateY(-2px);
      background: rgba(34, 211, 238, .3);
      border-color: var(--blue);
      box-shadow: 0 0 14px rgba(34,211,238,.35);
    }

    .key:disabled {
      cursor: not-allowed;
      opacity: .5;
      transform: none;
    }

    .key.correct {
      color: #bbf7d0;
      background: rgba(34,197,94,.25);
      border-color: var(--green);
    }

    .key.wrong {
      color: #fecaca;
      background: rgba(239,68,68,.25);
      border-color: var(--red);
      animation: shake .35s ease;
    }

    .bottom {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 23px;
      flex-wrap: wrap;
    }

    button {
      border: 0;
      border-radius: 13px;
      padding: 12px 18px;
      color: white;
      font-weight: 800;
      font-size: 14px;
      cursor: pointer;
      transition: transform .2s, box-shadow .2s;
    }

    button:hover {
      transform: translateY(-2px);
    }

    button:active {
      transform: scale(.97);
    }

    .primary {
      background: linear-gradient(135deg, var(--purple), var(--pink));
      box-shadow: 0 8px 24px rgba(139, 92, 246, .35);
    }

    .secondary {
      background: rgba(255,255,255,.1);
      border: 1px solid rgba(255,255,255,.15);
      color: #e8eaff;
    }

    .overlay {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(3, 4, 18, .78);
      backdrop-filter: blur(8px);
    }

    .overlay.show {
      display: flex;
    }

    .result-box {
      width: min(510px, 100%);
      padding: 38px 25px;
      text-align: center;
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 27px;
      background: linear-gradient(145deg, #1e2457, #161738);
      box-shadow: 0 0 60px rgba(139,92,246,.35);
      animation: pop .4s ease;
    }

    .result-emoji {
      font-size: 60px;
    }

    .result-box h2 {
      margin: 12px 0;
      font-size: 38px;
    }

    .result-word {
      margin: 20px 0;
      color: var(--blue);
      font-size: 36px;
      font-weight: 900;
      letter-spacing: 8px;
    }

    .result-text {
      margin-bottom: 22px;
      color: var(--muted);
      font-size: 17px;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }

    @keyframes pop {
      0% {
        transform: scale(.8);
        opacity: .3;
      }

      100% {
        transform: scale(1);
        opacity: 1;
      }
    }

    @media (max-width: 850px) {
      .game {
        grid-template-columns: 1fr;
      }

      .hangman,
      .question-card {
        min-height: auto;
      }

      .hangman {
        padding: 15px;
      }

      svg {
        height: 300px;
      }

      .top-info {
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      .game-title {
        grid-column: 1 / -1;
      }

      .question-counter {
        text-align: left;
      }
    }

    @media (max-width: 520px) {
      .app {
        width: calc(100% - 20px);
        padding-top: 15px;
      }

      .keyboard {
        grid-template-columns: repeat(7, 1fr);
      }

      .letter-slot {
        width: 32px;
        font-size: 26px;
      }

      .question-card {
        padding: 20px 15px;
      }
    }
  </style>
</head>

<body>
  <div class="app">
    <header>
      <div class="brand">
        <div class="brand-icon">🎯</div>

        <div>
          <h1>ENGLISH HANGMAN</h1>
          <div class="subtitle">
            Guess the word and become the champion
          </div>
        </div>
      </div>
    </header>

    <div class="top-info">
      <div class="game-title">🎮 GAME SHOW</div>

      <div class="score">
        ⭐ SCORE: <span id="score">0</span>
      </div>

      <div class="question-counter" id="counter">
        QUESTION 1 / 8
      </div>
    </div>

    <div class="progress">
      <div class="progress-bar" id="progressBar"></div>
    </div>

    <div class="game">
      <div class="card hangman">
        <div class="hangman-label">LIVES</div>

        <svg viewBox="0 0 300 360" aria-label="Hangman drawing">
          <path class="draw" d="M35 330 H265"/>
          <path id="p1" class="draw hidden" d="M75 330 V35 H220"/>
          <path id="p2" class="draw hidden" d="M220 35 V70"/>
          <circle id="p3" class="draw hidden" cx="220" cy="105" r="35"/>
          <path id="p4" class="draw hidden" d="M220 140 V230"/>
          <path id="p5" class="draw hidden" d="M220 165 L175 205"/>
          <path id="p6" class="draw hidden" d="M220 165 L265 205"/>
          <path id="p7" class="draw hidden" d="M220 230 L180 290"/>
          <path id="p8" class="draw hidden" d="M220 230 L260 290"/>
        </svg>

        <div class="hearts" id="hearts"></div>
      </div>

      <div class="card question-card">
        <div class="question-label">QUESTION</div>

        <div class="question" id="question"></div>

        <div class="word" id="word"></div>

        <div class="status" id="status">
          🎯 Guess the hidden word!
        </div>

        <div class="keyboard" id="keyboard"></div>

        <div class="bottom">
          <button class="primary" onclick="nextWord()">
            Next word →
          </button>

          <button class="secondary" onclick="restart()">
            Restart
          </button>
        </div>
      </div>
    </div>
  </div>

  <div class="overlay" id="resultOverlay">
    <div class="result-box">
      <div class="result-emoji" id="resultEmoji">🎉</div>
      <h2 id="resultTitle">AMAZING!</h2>
      <div class="result-word" id="resultWord">MUSIC</div>
      <div class="result-text" id="resultText">You got it!</div>

      <button class="primary" onclick="closeResultAndNext()">
        NEXT WORD →
      </button>
    </div>
  </div>

  <script>
    const QUESTIONS = [
      ["Can you dance to it", "MUSIC"],
      ["I say: “Hello!” You say “Hello!” What do you do?", "REPEAT"],
      ["“What is ___?” — Can you guess the word?", "THIS"],
      ["What language do you use in our lesson?", "ENGLISH"],
      ["You are at home. You want to go to school. What do you do?", "GO"],
      ["You can't do your homework. What do you need?", "HELP"],
      ["Does your teacher give you work to do at home?", "HOMEWORK"],
      ["Can you ___ your name?", "SAY"]
    ];

    const MAX_MISTAKES = 8;
    const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";

    let current = 0;
    let answer = "";
    let guessed = new Set();
    let mistakes = 0;
    let score = 0;
    let roundFinished = false;

    function init() {
      startRound();
    }

    function startRound() {
      const item = QUESTIONS[current];

      answer = item[1]
        .toUpperCase()
        .replace(/[^A-Z]/g, "");

      guessed = new Set();
      mistakes = 0;
      roundFinished = false;

      document.getElementById("question").textContent = item[0];

      document.getElementById("counter").textContent =
        `QUESTION ${current + 1} / ${QUESTIONS.length}`;

      document.getElementById("status").textContent =
        "🎯 Guess the hidden word!";

      document.getElementById("status").className = "status";

      updateScore();
      updateProgress();
      updateDrawing();
      renderHearts();
      renderWord();
      renderKeyboard();
    }

    function renderWord(reveal = false) {
      const box = document.getElementById("word");
      box.innerHTML = "";

      for (const character of answer) {
        const slot = document.createElement("div");

        slot.className = "letter-slot";
        slot.textContent =
          guessed.has(character) || reveal ? character : "";

        box.appendChild(slot);
      }
    }

    function renderKeyboard() {
      const box = document.getElementById("keyboard");
      box.innerHTML = "";

      alphabet.split("").forEach(character => {
        const button = document.createElement("button");

        button.className = "key";
        button.textContent = character;
        button.onclick = () => guess(character);

        if (guessed.has(character)) {
          button.disabled = true;

          button.classList.add(
            answer.includes(character) ? "correct" : "wrong"
          );
        }

        box.appendChild(button);
      });
    }

    function renderHearts() {
      const box = document.getElementById("hearts");
      box.innerHTML = "";

      for (let i = 0; i < MAX_MISTAKES; i++) {
        const heart = document.createElement("span");

        heart.className = "heart";

        if (i < mistakes) {
          heart.classList.add("lost");
        }

        heart.textContent = "❤️";
        box.appendChild(heart);
      }
    }

    function updateDrawing() {
      for (let i = 1; i <= MAX_MISTAKES; i++) {
        document
          .getElementById(`p${i}`)
          .classList.toggle("hidden", i > mistakes);
      }
    }

    function updateScore() {
      document.getElementById("score").textContent = score;
    }

    function updateProgress() {
      const progress =
        ((current + 1) / QUESTIONS.length) * 100;

      document.getElementById("progressBar").style.width =
        `${progress}%`;
    }

    function isWon() {
      return answer.split("").every(character =>
        guessed.has(character)
      );
    }

    function guess(character) {
      if (
        guessed.has(character) ||
        roundFinished ||
        mistakes >= MAX_MISTAKES
      ) {
        return;
      }

      guessed.add(character);

      if (answer.includes(character)) {
        score += 100;
      } else {
        mistakes++;
        score = Math.max(0, score - 10);
      }

      updateScore();
      renderWord();
      renderKeyboard();
      renderHearts();
      updateDrawing();

      if (isWon()) {
        finishRound(true);
      } else if (mistakes >= MAX_MISTAKES) {
        finishRound(false);
      }
    }

    function finishRound(won) {
      roundFinished = true;

      const status = document.getElementById("status");

      if (won) {
        status.textContent = "🎉 Correct! Well done!";
        status.className = "status win";

        score += 100;
        updateScore();

        setTimeout(() => {
          showResult(
            "🎉",
            "AMAZING!",
            answer,
            "You got it!"
          );
        }, 450);
      } else {
        status.textContent = `The word was: ${answer}`;
        status.className = "status lose";

        renderWord(true);

        setTimeout(() => {
          showResult(
            "😢",
            "OH NO!",
            answer,
            "Better luck next time!"
          );
        }, 450);
      }
    }

    function showResult(emoji, title, word, text) {
      document.getElementById("resultEmoji").textContent = emoji;
      document.getElementById("resultTitle").textContent = title;
      document.getElementById("resultWord").textContent = word;
      document.getElementById("resultText").textContent = text;
      document.getElementById("resultOverlay").classList.add("show");
    }

    function closeResultAndNext() {
      document.getElementById("resultOverlay").classList.remove("show");
      nextWord();
    }

    function nextWord() {
      current = (current + 1) % QUESTIONS.length;
      startRound();
    }

    function restart() {
      current = 0;
      score = 0;
      startRound();
    }

    document.addEventListener("keydown", event => {
      const character = event.key.toUpperCase();

      if (/^[A-Z]$/.test(character)) {
        guess(character);
      }
    });

    init();
  </script>
</body>
</html>
